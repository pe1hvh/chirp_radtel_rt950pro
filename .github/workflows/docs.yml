# Build the API documentation of the driver (Google-style docstrings,
# rendered with pdoc) and publish it on GitHub Pages.
#
# Both branches end up in ONE Pages site (GitHub Pages allows only one site
# per repository, and every deploy replaces the whole site):
#
#   main    -> https://pe1hvh.github.io/chirp_radtel_rt950pro/radtel_rt950pro.html
#   develop -> https://pe1hvh.github.io/chirp_radtel_rt950pro/develop/radtel_rt950pro.html
#
# A push to either branch rebuilds both, so the live (main) version is never
# overwritten by develop.
#
# One-time setup:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add "develop" next to "main" (otherwise the deploy from develop is refused).
name: docs

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdoc
        run: pip install pdoc

      # CHIRP is not needed: the driver has stand-ins for documentation builds.
      # Each branch is built with its own driver and its own docs/templates.
      - name: Build main (site root)
        working-directory: main
        run: |
          PYTHONPATH=. pdoc --docformat google -t docs/templates \
            -o "$GITHUB_WORKSPACE/site" radtel_rt950pro

      - name: Build develop (site/develop)
        working-directory: develop
        run: |
          PYTHONPATH=. pdoc --docformat google -t docs/templates \
            -o "$GITHUB_WORKSPACE/site/develop" radtel_rt950pro

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
