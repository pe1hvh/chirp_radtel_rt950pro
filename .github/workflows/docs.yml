# Build the API documentation of the driver (Google-style docstrings,
# rendered with pdoc) and publish it on GitHub Pages.
#
# Both branches end up in ONE Pages site (GitHub Pages allows only one site
# per repository, and every deploy replaces the whole site):
#
#   main    -> https://pe1hvh.github.io/chirp_radtel_rt950pro/radtel_rt950pro.html
#   develop -> https://pe1hvh.github.io/chirp_radtel_rt950pro/develop/radtel_rt950pro.html
#
# A push to either branch rebuilds both, so the live (main) version is never
# overwritten by develop. Each branch is checked and built with its own
# driver, docs/build.py and docs/templates.
#
# One-time setup:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add "develop" next to "main" (otherwise the deploy from develop is refused).
name: docs

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        # pdoc pinned to 16.x: the template in docs/templates extends its default.
        run: pip install "pdoc>=16,<17" pydocstyle "pydoclint>=0.11,<0.12" pylint

      # Every class, function, method, parameter and return value must be
      # documented (public and private). pydocstyle only checks the names in
      # __all__, so pylint's missing-docstring checks, with no exemption for
      # names starting with "_", cover every other module-level class,
      # function and method (nested functions are not checked by either).
      # pydoclint checks Args/Returns/Yields against the signatures;
      # DOC106/107 (type hints) and DOC502/503 (exceptions raised in called
      # functions) are not checked.
      # From 0.1.6 on (when tools/check_docstrings.py exists in the checkout)
      # the checks also cover docs/build.py and tools/*.py, and
      # check_docstrings.py reports every module, class and function without
      # a docstring, nested functions and the CHIRP stand-ins included.
      - name: Check docstrings (main)
        working-directory: main
        run: |
          FILES="radtel_rt950pro.py"
          if [ -f tools/check_docstrings.py ]; then
            FILES="radtel_rt950pro.py docs/build.py $(ls tools/*.py)"
            python3 tools/check_docstrings.py $FILES
          fi
          pydocstyle --convention=google $FILES
          pylint --disable=all --no-docstring-rgx='^$' \
            --enable=missing-module-docstring,missing-class-docstring,missing-function-docstring \
            $FILES
          pydoclint --style=google --skip-checking-short-docstrings=False \
            --arg-type-hints-in-docstring=False --check-return-types=False \
            --check-yield-types=False --check-class-attributes=False \
            --allow-init-docstring=True $FILES > doclint.txt 2>&1 || true
          if grep -E "DOC[0-9]+:" doclint.txt | grep -vE "DOC(106|107|502|503):"; then
            echo "Docstring check failed (see above)"; exit 1
          fi

      - name: Check docstrings (develop)
        working-directory: develop
        run: |
          FILES="radtel_rt950pro.py"
          if [ -f tools/check_docstrings.py ]; then
            FILES="radtel_rt950pro.py docs/build.py $(ls tools/*.py)"
            python3 tools/check_docstrings.py $FILES
          fi
          pydocstyle --convention=google $FILES
          pylint --disable=all --no-docstring-rgx='^$' \
            --enable=missing-module-docstring,missing-class-docstring,missing-function-docstring \
            $FILES
          pydoclint --style=google --skip-checking-short-docstrings=False \
            --arg-type-hints-in-docstring=False --check-return-types=False \
            --check-yield-types=False --check-class-attributes=False \
            --allow-init-docstring=True $FILES > doclint.txt 2>&1 || true
          if grep -E "DOC[0-9]+:" doclint.txt | grep -vE "DOC(106|107|502|503):"; then
            echo "Docstring check failed (see above)"; exit 1
          fi

      # CHIRP is not needed: the driver has stand-ins for documentation builds.
      # DOCS_BRANCH sets the branch for links from the documents to GitHub
      # (one run builds both branches). An environment variable, not an
      # option, so an older build.py on the other branch simply ignores it.
      - name: Build main (site root)
        working-directory: main
        env:
          DOCS_BRANCH: main
        run: python docs/build.py -o "$GITHUB_WORKSPACE/site"

      - name: Build develop (site/develop)
        working-directory: develop
        env:
          DOCS_BRANCH: develop
        run: python docs/build.py -o "$GITHUB_WORKSPACE/site/develop"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
